<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浩一导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="/assets/css/main.css">
<script defer src="/assets/js/alpine.min.js"></script>
</head>
<body>
<div id="bg"></div>
<div class="container">
  <div class="top-bar">
    <div class="weather" id="weather">
      <span class="weather-icon">🌤️</span>
      <span id="weather-text">加载天气中...</span>
    </div>
    <div class="top-actions">
      <div class="stats" id="stats">访客: --</div>
      <button class="btn-icon" onclick="switchWallpaper()" title="切换壁纸">🎨</button>
    </div>
  </div>

  <div class="left-panel">
    <div class="profile-card">
      <div class="avatar"><img id="avatar" src="" alt="avatar"></div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-bio" id="profile-bio"></div>
      <div class="profile-location" id="profile-location">📍 <span></span></div>
    </div>

    <div class="time-card">
      <div class="time-display" id="time"></div>
      <div class="date-display" id="date"></div>
      <div class="running-days" id="running-days"></div>
    </div>

    <div class="contacts-card">
      <h3>联系方式</h3>
      <div class="contact-list" id="contacts"></div>
    </div>
  </div>

  <div class="right-panel">
    <h2>🌐 我的站点</h2>
    <div class="sites-grid" id="sites"></div>
  </div>

  <div class="footer" id="footer"></div>
</div>


<script defer src="/assets/js/app.js"></script>
</body>
</html>
