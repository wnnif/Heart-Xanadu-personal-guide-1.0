<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浩一导航</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f8fbff'/%3E%3Cpath d='M20 53 50 25l30 28v31H59V63H41v21H20Z' fill='%23747bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.seaya.link" crossorigin>
<link rel="dns-prefetch" href="//api.seaya.link">
<link rel="stylesheet" href="/assets/css/main.css">
<script defer src="/assets/js/alpine.min.js"></script>
</head>
<body>
<div id="bg"></div>
<div class="zyyo-filter"></div>
<div class="container">
  <div class="top-bar">
    <div class="weather" id="weather">
      <span class="weather-icon">🌤️</span>
      <span id="weather-text">加载天气中...</span>
    </div>
    <div class="top-actions">
      <div class="stats" id="stats">访客: --</div>
      <button class="btn-icon" id="theme-toggle" onclick="toggleGradientTheme()" title="切换深色/浅色渐变">🌙</button>
      <button class="btn-icon" onclick="switchWallpaper()" title="切换壁纸">🎨</button>
    </div>
  </div>

  <div class="left-panel">
    <div class="profile-card">
      <div class="avatar"><img id="avatar" src="" alt="avatar"></div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-bio" id="profile-bio"></div>
      <div class="profile-location" id="profile-location">📍 <span></span></div>
    </div>

    <div class="time-card">
      <div class="time-display" id="time"></div>
      <div class="day-progress-container" title="今日时间进度">
        <div class="day-progress-bar" id="day-progress"></div>
      </div>
      <div class="date-display" id="date"></div>
      <div class="running-days" id="running-days"></div>
    </div>

    <div class="contacts-card">
      <h3>联系方式</h3>
      <div class="contact-list" id="contacts"></div>
    </div>
  </div>

  <div class="right-panel">
    <h2>🌐 我的站点</h2>
    <div class="sites-grid" id="sites"></div>
  </div>

  <div class="footer" id="footer"></div>
</div>


<script defer src="/assets/js/app.js"></script>
</body>
</html>
